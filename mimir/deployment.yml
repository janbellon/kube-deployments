apiVersion: v1
kind: Namespace
metadata:
  name: mimir
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mimir-s3-secret
  namespace: mimir
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mimir-s3-secret
    creationPolicy: Owner
  data:
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: s3/mimir
        property: secret_key
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: s3/mimir
        property: access_key
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mimir-data
  namespace: mimir
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: mimir
  namespace: mimir
  labels:
    app: mimir
spec:
  containers:
    - name: mimir
      image: grafana/mimir:latest
      args:
        - "-config.file=/etc/mimir.yaml"
        - "-target=all"
        - "-config.expand-env=true"
      ports:
        - containerPort: 9009
          name: http
      env:
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: mimir-s3-secret
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: mimir-s3-secret
              key: AWS_ACCESS_KEY_ID
      volumeMounts:
        - name: mimir-config
          mountPath: /etc/mimir.yaml
          subPath: mimir.yaml
  volumes:
    - name: mimir-config
      configMap:
        name: mimir-config
---
apiVersion: v1
kind: Service
metadata:
  name: mimir
  namespace: mimir
spec:
  type: LoadBalancer
  selector:
    app: mimir
  ports:
    - name: http
      port: 9009
      targetPort: 9009
      protocol: TCP
