apiVersion: v1
kind: Namespace
metadata:
  name: loki
---
apiVersion: v1
kind: Pod
metadata:
  name: loki
  namespace: loki
  labels:
    app: loki
spec:
  containers:
    - name: loki
      image: grafana/loki:3.7.2
      env:
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: loki-s3-secret
              key: access_key
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: loki-s3-secret
              key: secret_key
      args:
        - "-config.file=/etc/loki/loki.yml"
        - "-config.expand-env=true"
      ports:
        - containerPort: 3100
          name: http
      volumeMounts:
        - name: loki-config
          mountPath: /etc/loki/loki.yml
          subPath: loki.yml
  volumes:
    - name: loki-config
      configMap:
        name: loki-config
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: loki
spec:
  type: ClusterIP
  selector:
    app: loki
  ports:
    - name: http
      port: 3100
      targetPort: 3100
      protocol: TCP
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loki-s3-secret
  namespace: loki
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: loki-s3-secret
    creationPolicy: Owner
  data:
    - secretKey: access_key
      remoteRef:
        key: s3/loki
        property: access_key
    - secretKey: secret_key
      remoteRef:
        key: s3/loki
        property: secret_key
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: loki-tls
  namespace: loki
spec:
  secretName: loki-tls
  dnsNames:
    - loki.vil.nbl.sh
  issuerRef:
    name: acme-nbl
    kind: ClusterIssuer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loki
  namespace: loki
  annotations:
    cert-manager.io/cluster-issuer: acme-nbl
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - loki.vil.nbl.sh
      secretName: loki-tls
  rules:
    - host: loki.vil.nbl.sh
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: loki
                port:
                  number: 3100
