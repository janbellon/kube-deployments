---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: homepage
  namespace: homepage

spec:
  replicas: 1

  selector:
    matchLabels:
      app: homepage

  template:
    metadata:
      labels:
        app: homepage

    spec:
      securityContext:
        fsGroup: 1000

      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:latest

          ports:
            - containerPort: 3000

          volumeMounts:
            - name: homepage-config
              mountPath: /app/config

          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: dash.vil.nbl.sh

      volumes:
        - name: homepage-config
          persistentVolumeClaim:
            claimName: homepage-config
