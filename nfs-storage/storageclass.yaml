apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-csi

  annotations: 
    storageclass.kubernetes.io/is-default-class: "true"

provisioner: nfs.csi.k8s.io

parameters:
  server: 10.34.2.1
  share: mnt/Storage_pool/VM-NFS/k3s-prd

reclaimPolicy: Retain
volumeBindingMode: Immediate
mountOptions:
  - nfsvers=4.1

