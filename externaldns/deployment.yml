apiVersion: v1
kind: Namespace
metadata:
  name: external-dns
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-dns
  namespace: external-dns
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-dns
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods", "nodes"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-dns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-dns
subjects:
  - kind: ServiceAccount
    name: external-dns
    namespace: external-dns
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-dns-rfc2136
  namespace: external-dns
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: external-dns-rfc2136
    creationPolicy: Owner
  data:
    - secretKey: tsig-secret
      remoteRef:
        key: kv/knotdns
        property: tsig-k3s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: external-dns
spec:
  selector:
    matchLabels:
      app: external-dns
  template:
    metadata:
      labels:
        app: external-dns
    spec:
      serviceAccountName: external-dns
      containers:
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.16.1
          args:
            - --source=ingress
            - --source=service
            - --provider=rfc2136
            - --rfc2136-host=10.2.21.101
            - --rfc2136-port=5300
            - --rfc2136-zone=vil.nbl.sh
            - --rfc2136-tsig-keyname=tsig-k3s.
            - --rfc2136-tsig-secret=$(TSIG_SECRET)
            - --rfc2136-tsig-secret-alg=hmac-sha256
            - --rfc2136-min-ttl=60s
            - --domain-filter=vil.nbl.sh
            - --txt-owner-id=k3s-prd-nbl
            - --registry=txt
            - --policy=sync
            - --interval=1m
            - --log-level=info
          env:
            - name: TSIG_SECRET
              valueFrom:
                secretKeyRef:
                  name: external-dns-rfc2136
                  key: tsig-secret
