---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: external-dns
spec:
  selector:
    matchLabels:
      app: external-dns
  template:
    metadata:
      labels:
        app: external-dns
    spec:
      serviceAccountName: external-dns
      containers:
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.16.1
          args:
            - --source=ingress
            - --source=service
            - --provider=rfc2136
            - --rfc2136-host=10.2.21.101
            - --rfc2136-port=5300
            - --rfc2136-zone=vil.nbl.sh
            - --rfc2136-tsig-keyname=tsig-k3s.
            - --rfc2136-tsig-secret=$(TSIG_SECRET)
            - --rfc2136-tsig-secret-alg=hmac-sha256
            - --rfc2136-min-ttl=60s
            - --domain-filter=vil.nbl.sh
            - --txt-owner-id=k3s-prd-nbl
            - --registry=txt
            - --policy=sync
            - --interval=1m
            - --log-level=info
          env:
            - name: TSIG_SECRET
              valueFrom:
                secretKeyRef:
                  name: external-dns-rfc2136
                  key: tsig-secret
