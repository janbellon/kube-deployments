---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-dns-rfc2136
  namespace: external-dns
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: external-dns-rfc2136
    creationPolicy: Owner
  data:
    - secretKey: tsig-secret
      remoteRef:
        key: kv/knotdns
        property: tsig-k3s
