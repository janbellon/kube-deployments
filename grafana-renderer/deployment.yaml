apiVersion: v1
kind: Namespace
metadata:
  name: grafana-renderer
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-renderer-secret
  namespace: grafana-renderer
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: grafana-renderer-secret
    creationPolicy: Owner
  data:
    - secretKey: renderer_token
      remoteRef:
        key: grafana
        property: renderer_token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-renderer
  namespace: grafana-renderer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana-renderer
  template:
    metadata:
      labels:
        app: grafana-renderer
    spec:
      containers:
        - name: grafana-renderer
          image: grafana/grafana-image-renderer:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: HTTP_HOST
              value: "0.0.0.0"
            - name: HTTP_PORT
              value: "8080"
            - name: ENABLE_METRICS
              value: "true"
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grafana-renderer-secret
                  key: renderer_token
            - name: TRACING_INSECURE
              value: "true"
            - name: LOG_LEVEL
              value: "error"
            - name: BROWSER_FLAG
              value: "--ignore-certificate-errors"
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-renderer
  namespace: grafana-renderer
spec:
  type: ClusterIP
  selector:
    app: grafana-renderer
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
