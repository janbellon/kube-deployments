---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-server
  namespace: authentik
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authentik-server
  template:
    metadata:
      labels:
        app: authentik-server
    spec:
      containers:
        - name: authentik-server
          image: ghcr.io/goauthentik/server:2025.10.2
          imagePullPolicy: IfNotPresent
          command: ["ak"]
          args: ["server"]

          ports:
            - name: http
              containerPort: 9000
            - name: https
              containerPort: 9443

          envFrom:
            - configMapRef:
                name: authentik-env
            - secretRef:
                name: authentik-secrets

          volumeMounts:
            - name: custom-templates
              mountPath: /templates

          readinessProbe:
            httpGet:
              path: /-/health/ready/
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /-/health/live/
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 30

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

      volumes:
        - name: custom-templates
          persistentVolumeClaim:
            claimName: authentik-custom-templates
