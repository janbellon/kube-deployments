apiVersion: v1
kind: Namespace
metadata:
  name: authentik
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secrets
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: authentik-secrets
    creationPolicy: Owner
  data:
    - secretKey: AUTHENTIK_SECRET_KEY
      remoteRef:
        key: kv/authentik
        property: secret_key
    - secretKey: AUTHENTIK_POSTGRESQL__PASSWORD
      remoteRef:
        key: kv/postgresql/users
        property: authentik_user
    - secretKey: AUTHENTIK_STORAGE__MEDIA__S3__ACCESS_KEY
      remoteRef:
        key: kv/s3/authentik
        property: access_key
    - secretKey: AUTHENTIK_STORAGE__MEDIA__S3__SECRET_KEY
      remoteRef:
        key: kv/s3/authentik
        property: secret_key
    - secretKey: AUTHENTIK_BOOTSTRAP_PASSWORD
      remoteRef:
        key: kv/authentik
        property: bootstrap_password
    - secretKey: AUTHENTIK_BOOTSTRAP_TOKEN
      remoteRef:
        key: kv/authentik
        property: bootstrap_token
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-env
  namespace: authentik
data:
  AUTHENTIK_ERROR_REPORTING__ENABLED: "true"

  AUTHENTIK_POSTGRESQL__HOST: "10.34.0.10"
  AUTHENTIK_POSTGRESQL__PORT: "5432"
  AUTHENTIK_POSTGRESQL__USER: "jan_authentik_user"
  AUTHENTIK_POSTGRESQL__NAME: "jan_authentik"
  AUTHENTIK_POSTGRESQL__SSLMODE: "prefer"

  AUTHENTIK_STORAGE__MEDIA__BACKEND: "s3"
  AUTHENTIK_STORAGE__MEDIA__S3__BUCKET_NAME: "authentik"
  AUTHENTIK_STORAGE__MEDIA__S3__ENDPOINT: "https://s3.nobell.fr"
  AUTHENTIK_STORAGE__MEDIA__S3__CUSTOM_DOMAIN: "authentik.s3.nobell.fr"

  AUTHENTIK_BOOTSTRAP_EMAIL: "admin@enpos.fr"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-server
  namespace: authentik
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authentik-server
  template:
    metadata:
      labels:
        app: authentik-server
    spec:
      containers:
        - name: authentik-server
          image: ghcr.io/goauthentik/server:2025.10.2
          imagePullPolicy: IfNotPresent
          command: ["ak"]
          args: ["server"]

          ports:
            - name: http
              containerPort: 9000
            - name: https
              containerPort: 9443

          envFrom:
            - configMapRef:
                name: authentik-env
            - secretRef:
                name: authentik-secrets

          volumeMounts:
            - name: custom-templates
              mountPath: /templates

          readinessProbe:
            httpGet:
              path: /-/health/ready/
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /-/health/live/
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 30

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

      volumes:
        - name: custom-templates
          persistentVolumeClaim:
            claimName: authentik-custom-templates
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-worker
  namespace: authentik
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authentik-worker
  template:
    metadata:
      labels:
        app: authentik-worker
    spec:
      containers:
        - name: authentik-worker
          image: ghcr.io/goauthentik/server:2025.10.2
          imagePullPolicy: IfNotPresent
          command: ["ak"]
          args: ["worker"]

          securityContext:
            runAsUser: 0

          envFrom:
            - configMapRef:
                name: authentik-env
            - secretRef:
                name: authentik-secrets

          volumeMounts:
            - name: custom-templates
              mountPath: /templates

            - name: certs
              mountPath: /certs

            - name: ca-certificates
              mountPath: /usr/local/share/ca-certificates

          readinessProbe:
            exec:
              command:
                - ak
                - healthcheck
            initialDelaySeconds: 20
            periodSeconds: 30

          livenessProbe:
            exec:
              command:
                - ak
                - healthcheck
            initialDelaySeconds: 60
            periodSeconds: 60

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

      volumes:
        - name: custom-templates
          persistentVolumeClaim:
            claimName: authentik-custom-templates

        - name: certs
          persistentVolumeClaim:
            claimName: authentik-certs

        - name: ca-certificates
          persistentVolumeClaim:
            claimName: authentik-ca-certificates
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authentik-custom-templates
  namespace: authentik
spec:
  storageClassName: nfs-csi
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authentik-certs
  namespace: authentik
spec:
  storageClassName: nfs-csi
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authentik-ca-certificates
  namespace: authentik
spec:
  storageClassName: nfs-csi
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: authentik-server
  namespace: authentik
spec:
  type: LoadBalancer
  selector:
    app: authentik-server
  ports:
    - name: http
      port: 9000
      targetPort: 9000
    - name: https
      port: 9443
      targetPort: 9443
