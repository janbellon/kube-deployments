---
apiVersion: v1
kind: Service
metadata:
  name: frigate
  namespace: frigate
spec:
  type: LoadBalancer
  loadBalancerIP: 10.2.51.116
  selector:
    app: frigate
  ports:
    - name: web
      port: 5000
      targetPort: 5000
    - name: go2rtc
      port: 1984
      targetPort: 1984
    - name: rtsp
      port: 8554
      targetPort: 8554
    - name: webrtc-tcp
      port: 8555
      targetPort: 8555
