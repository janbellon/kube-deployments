apiVersion: v1
kind: Namespace
metadata:
  name: authelia
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-secrets
  namespace: authelia
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: authelia-secrets
    creationPolicy: Owner
  data:
    - secretKey: AUTHELIA_JWT_SECRET
      remoteRef:
        key: authelia
        property: jwt_secret
    - secretKey: AUTHELIA_SESSION_SECRET
      remoteRef:
        key: authelia
        property: session_secret
    - secretKey: AUTHELIA_STORAGE_ENCRYPTION_KEY
      remoteRef:
        key: authelia
        property: storage_encryption_key
    - secretKey: AUTHELIA_STORAGE_POSTGRES_PASSWORD
      remoteRef:
        key: postgresql/users
        property: authelia_user
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authelia-data
  namespace: authelia
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia
  namespace: authelia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authelia
  template:
    metadata:
      labels:
        app: authelia
    spec:
      containers:
        - name: authelia
          image: authelia/authelia:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 9091
          envFrom:
            - secretRef:
                name: authelia-secrets
          env:
            - name: AUTHELIA_STORAGE_POSTGRES_ADDRESS
              value: tcp://10.34.0.10:5432
            - name: AUTHELIA_STORAGE_POSTGRES_DATABASE
              value: jan_authelia
            - name: AUTHELIA_STORAGE_POSTGRES_USERNAME
              value: jan_authelia_user
          volumeMounts:
            - name: authelia-config
              mountPath: /config/configuration.yml
              subPath: configuration.yml
            - name: authelia-data
              mountPath: /config
          readinessProbe:
            httpGet:
              path: /api/health
              port: 9091
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 9091
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: authelia-config
          configMap:
            name: authelia-config
        - name: authelia-data
          persistentVolumeClaim:
            claimName: authelia-data
---
apiVersion: v1
kind: Service
metadata:
  name: authelia
  namespace: authelia
spec:
  type: LoadBalancer
  selector:
    app: authelia
  ports:
    - name: http
      port: 9091
      targetPort: 9091
      protocol: TCP
