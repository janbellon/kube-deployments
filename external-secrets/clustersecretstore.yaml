apiVersion: external-secrets.io/v1
kind: ClusterSecretStore

metadata:
  name: vault-backend

spec:
  provider:
    vault:
      server: "https://vault.vil.nbl.sh"
      path: "kv"
      version: "v2"
      caBundle: ""
      auth:
        tokenSecretRef:
          name: vault-token
          key: token
          namespace: external-secrets
