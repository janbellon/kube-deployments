apiVersion: v1
kind: Namespace
metadata:
  name: grafana
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: grafana
  name: grafana
  namespace: grafana
spec:
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 472
        supplementalGroups:
          - 0
      containers:
        - name: grafana
          image: grafana/grafana:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http-grafana
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /robots.txt
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 2
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            tcpSocket:
              port: 3000
            timeoutSeconds: 1
          resources:
            requests:
              cpu: 250m
              memory: 750Mi
          volumeMounts:
            - name: grafana-config
              mountPath: /etc/grafana
          envFrom:
            - secretRef:
                name: grafana-secrets
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10

      volumes:
        - name: grafana-config
          configMap:
            name: grafana-config
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-secrets
  namespace: grafana
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: grafana-secrets
    creationPolicy: Owner
  data:
    - secretKey: GF_DATABASE_PASSWORD
      remoteRef:
        key: "postgresql/users"
        property: "grafana_user"
    - secretKey: GF_SECURITY_ADMIN_PASSWORD
      remoteRef:
        key: "grafana"
        property: "admin_password"
    - secretKey: GF_SECURITY_SECRET_KEY
      remoteRef:
        key: "grafana"
        property: "secret_key"
    - secretKey: GF_EXTERNAL_IMAGE_STORAGE_S3_ACCESS_KEY
      remoteRef:
        key: "s3/grafana"
        property: "access_key"
    - secretKey: GF_EXTERNAL_IMAGE_STORAGE_S3_SECRET_KEY
      remoteRef:
        key: "s3/grafana"
        property: "secret_key"
    - secretKey: GF_STORAGE_MANAGER_ENCRYPTION_SECRET_KEY_V1_SECRET_KEY
      remoteRef:
        key: "grafana"
        property: "sm_secret_key"
    - secretKey: LDAP_BIND_PASSWORD
      remoteRef:
        key: "authentik"
        property: "ldap_bind_password"
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: grafana
spec:
  type: LoadBalancer

  selector:
    app: grafana

  ports:
    - name: http
      port: 3000
      targetPort: 3000
